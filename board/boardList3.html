        // loadBoardData 함수 정의 (fetch API 사용)
        async function loadBoardData(filePath) {
            try {
                const response = await fetch(filePath); // 파일 경로로 데이터 요청
                if (!response.ok) { // 응답이 성공적이지 않으면 오류 발생
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json(); // 응답을 JSON 형태로 파싱
                return data; // 파싱된 데이터 반환
            } catch (error) {
                console.error("데이터 로드 중 오류 발생:", error);
                return []; // 오류 발생 시 빈 배열 반환 또는 적절한 오류 처리
            }
        }

        // 페이지 로드 시 실행
        document.addEventListener('DOMContentLoaded', () => {
            const categorySelect = document.getElementById('category1');

            loadBoardData("../data/region.json")
                .then(regions => {

                    regions.forEach(region => {
                        const option = document.createElement('option');
                        option.value = region.id;
                        option.textContent = region.name;
                        categorySelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error("옵션 생성 중 오류 발생:", error);
                });
        });

            loadBoardData("../data/noodle.json")
                .then(data => { // 데이터 로드 성공 시 실행
                    // 불러온 데이터에서 'type'이 "thinkness"인 항목만 필터링하여 옵션 생성
                    data.forEach(item => {
                        if (item.type === "thinkness") {
