<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>regionTheme</title>
        <!-- 공통사용 -->
        <link rel="stylesheet" href="../css/reset.css" />
        <link rel="stylesheet" href="../css/common.css" />
        <!-- 각화면 css 생성하여 사용 -->
        <link rel="stylesheet" href="../css/regionTheme.css" />
    </head>
    <body>
        <div id="wrapper">
            <!-- header(공통사용) -->
            <header id="header"></header>
            <!-- 작업영역 -->
            <main id="main">
                <div id="filterWrapper" class="outline">
                    <div class="filters"></div>
                </div>
                <div id="selectorWrapper">
                    <ul class="selectorContents"></ul>
                </div>
                <div id="contentWrapper">
                    <div id="contentList"></div>
                </div>
                <div id="contentNav">
                    <nav class="pagination">
                        <button class="pageBtn prev" aria-label="이전 페이지">
                            &lt;
                        </button>
                        <ul class="pageList"></ul>
                        <button class="pageBtn next" aria-label="다음 페이지">
                            &gt;
                        </button>
                    </nav>
                </div>
            </main>
            <!-- footer영역(공통사용) -->
            <footer id="footer"></footer>
        </div>

        <template id="contentItemTemplate">
            <div class="contentItem">
                <a href="">
                    <div class="contentImage">
                        <img src="" alt="" />
                    </div>
                    <div class="contentsInfo">
                        <div class="contentTitle"></div>
                        <div class="contentCategory">
                            <ul class="categoryList"></ul>
                        </div>
                        <div class="contentDescription"></div>
                    </div>
                </a>
                <div class="contentLike"></div>
            </div>
        </template>

        <!-- 공통사용 -->
        <script src="../js/common.js"></script>
        <!-- 각화면 js생성하여 사용 -->
        <script type="module" src="../js/regionTheme.js"></script>
    </body>
</html>
