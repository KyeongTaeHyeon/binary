<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RaFeed</title>
        <!-- 공통사용 -->
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/common.css" />
        <!-- 각화면 css 생성하여 사용 -->
        <link rel="stylesheet" href="css/main.css" />
    </head>

    <body>
        <div id="wrapper">
            <!-- header(공통사용) -->
            <header id="header"></header>
            <!-- 작업영역 -->
            <main id="main">
                <div id="modal"></div>
                <div id="container">
                    <!-- 히어로 영역 : 최신 유행 라멘  -->
                    <div class="mainHero">
                        <div class="mainSlides">
                            <div class="slide">
                                <div class="slideImg">
                                    <img
                                        src="img/heroieke1920x1080.jpg"
                                        alt="이에케라멘"
                                    />
                                    <img
                                        src="img/herochangke.jpg"
                                        alt="창케라멘"
                                    />
                                    <img
                                        src="img/herojiro1920x1080.jpeg"
                                        alt="지로케라멘"
                                    />
                                    <img
                                        src="img/herochuka.jpeg"
                                        alt="츄카소바"
                                    />
                                </div>
                                <div class="slideText">
                                    <p class="slideTitle">이에케 라멘</p>
                                    <a href="" class="modal">라멘 데이터</a>
                                </div>
                            </div>
                        </div>
                        <div class="mainSlideController">
                            <div class="mainPager">
                                <ul class="pagerUl">
                                    <li>
                                        <button><span>1</span></button>
                                    </li>
                                    <li class="active">
                                        <button><span>2</span></button>
                                    </li>
                                    <li>
                                        <button><span>3</span></button>
                                    </li>
                                    <li>
                                        <button><span>4</span></button>
                                    </li>
                                </ul>
                            </div>
                            <p class="btnPrev"><button>이전으로</button></p>
                            <p class="btnNext"><button>다음으로</button></p>
                        </div>
                    </div>
                    <!-- 라멘이미지영역(정보탭 : 육수) -->
                    <section class="section1"></section>
                    <!-- 라멘의 기타요소 영역(정보탭 : 고명, 면) -->
                    <section class="section2"></section>
                    <!-- 게시판 이동 영역 -->
                    <section class="section3">
                        <div class="boardWrap">
                            <div class="boardList">
                                <div class="text">
                                    <h2>
                                        <span class="boardTitle">게시판</span>
                                    </h2>
                                    <p>나의 라멘메이트를 찾고싶다면 여기로!</p>
                                    <div class="boardBtn">
                                        <a href="">이동하기</a>
                                    </div>
                                </div>
                            </div>
                            <div class="boardImg">
                                <img src="img/chat_img.jpg" alt="커뮤니티" />
                            </div>
                        </div>
                    </section>
                </div>
            </main>
            <!-- footer영역(공통사용) -->
            <footer id="footer"></footer>
        </div>
        <!-- 화면 표현 영역 -->
        <template id="Boxtype01">
            <div class="contentsBox 01">
                <div class="contentsInfo">
                    <p class="ramenTitle"></p>
                    <p class="titleLine"></p>
                    <p class="subTitle"></p>
                    <p class="ramenText"></p>
                    <div class="btnLinks">
                        <div class="btnPopup">
                            <a class="modal" href="">
                                <div class="btnIcon">
                                    <p class="iconParts"></p>
                                </div>
                                <span class="btnText">라멘 데이터</span>
                            </a>
                        </div>
                        <div class="btnShop">
                            <a href="" target="_blank">
                                <p>추천 맛집</p>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="contentsImg">
                    <p class="shopIcon">
                        <img src="img/ramen01.png" alt="시오라멘" />
                    </p>
                    <div class="ramen-price">
                        <span class="price"></span>
                    </div>
                </div>
            </div>
        </template>
        <template id="Boxtype02">
            <div class="feature 01">
                <div class="etcInner">
                    <div class="etcLeft">
                        <img src="img/sect3_oil.jpg" />
                    </div>
                    <div class="etcRight">
                        <div class="etcText">
                            <h2 class="etcTitle">
                                <span class="features"
                                    >FEATURES<span class="featureNum">01</span>
                                </span>
                                <br />
                                <span class="subTitle">향미유</span>
                            </h2>
                            <p class="etcInfo">
                                보통은 아부라(油)라는 표현을 자주 쓴다. 라드나
                                구운 라드, 돼지 등기름, 닭기름 등이 주로 쓰이며,
                                새우기름이나 참깨, 식물유, 올리브유 등을
                                사용하거나 파기름, 마늘기름, 허브를 재운 기름 등
                                다른 재료를 통해 향을 내어 사용하기도 하는 등
                                활용하는 방식이 다양하다. 쿠마모토 지방에서는
                                쿠로마유라고 불리는 흑마늘을 볶은 기름을
                                향미유로 내어 라멘을 만들기도 한다. 간혹 탄탄멘
                                같은 일본식 중화요리와 가까운 라멘장르에는
                                고추기름이 쓰이기도 한다.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <!-- 팝업영역 -->
        <template id="ramenPopup">
            <div class="modalWrap">
                <div class="tempWrap">
                    <div class="realModalWrap">
                        <button class="closeBtn"></button>
                        <div class="tempTitle">
                            <div class="titleText">
                                <div class="tempRamenName"></div>
                                <h2 class="tempRamenData">라멘데이터</h2>
                            </div>
                            <div id="logo">
                                <img src="img/raFeed_Logo-Photoroom.png" />
                            </div>
                        </div>
                        <div class="tempText">
                            <div class="tempList">
                                <div class="left">스프 베이스</div>
                                <div class="rightbox">돼지뼈</div>
                            </div>
                            <div class="tempList richness">
                                <div class="left">스프 농도</div>
                                <div class="right">
                                    <div class="leftText">연 함</div>
                                    <div class="tempMeasure">
                                        <div class="tempLine">
                                            <span class="hide">직선</span>
                                        </div>
                                        <div class="tempCircle">
                                            <div></div>
                                            <div></div>
                                            <div class="active"></div>
                                            <div></div>
                                            <div></div>
                                        </div>
                                    </div>
                                    <div class="rightText">진 함</div>
                                </div>
                            </div>
                            <div class="tempList rich">
                                <div class="left">기름진 정도</div>
                                <div class="right">
                                    <div class="leftText">담백함</div>
                                    <div class="tempMeasure">
                                        <div class="tempLine">
                                            <span class="hide">직선</span>
                                        </div>
                                        <div class="tempCircle">
                                            <div class="active"></div>
                                            <div></div>
                                            <div></div>
                                        </div>
                                    </div>
                                    <div class="rightText">진 함</div>
                                </div>
                            </div>
                            <div class="tempList thickness">
                                <div class="left">면의 굵기</div>
                                <div class="right">
                                    <div class="leftText">가는면</div>
                                    <div class="tempMeasure">
                                        <div class="tempLine">
                                            <span class="hide">직선</span>
                                        </div>
                                        <div class="tempCircle">
                                            <div></div>
                                            <div></div>
                                            <div class="active"></div>
                                            <div></div>
                                            <div></div>
                                        </div>
                                    </div>
                                    <div class="rightText">굵은면</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <!-- 공통사용 -->
        <script src="js/common.js"></script>
        <!-- 각화면 js생성하여 사용 -->
        <script type="module" src="js/main.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    </body>
</html>
